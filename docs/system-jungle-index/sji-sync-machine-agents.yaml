version: "2.0"
system: "System Jungle Index"
authority_chain:
  - "ZENZY PRIME CORE"
  - "ZENZY ARCHON"
  - "SJI Governance Controller"
  - "ZENZY FUSION ENGINE"
  - "Sync Machine"
baseline_rule: "On first assessment, Previous SJI equals current SJI."
gate_mirror_rule: "Gate is authoritative formula; Gate State is automation-maintained select mirror."
agents:
  - id: "SJI-A01"
    name: "Intake Agent"
    trigger: "New System Jungle record created"
    guards:
      - "System Name present"
      - "Jungle Type present"
      - "Owner present"
      - "Environment present"
    steps:
      - "Validate required identity fields."
      - "If any field is missing, set Current State = INPUT REQUIRED and stop."
      - "Otherwise set Current State = REGISTERED."
      - "Create an unlocked Baseline Evidence Packet stub."
      - "Write Assessment initialized to the audit log."
    writes:
      - "Current State"
      - "Evidence Packets"
      - "Pressure Notes"
  - id: "SJI-A02"
    name: "Pressure Test Agent"
    trigger: "Test Approval changes to Approved"
    guards:
      - "Authority State = Granted"
      - "Rollback Verified = true"
    steps:
      - "If authority is not granted, set Current State = AUTHORITY DENIED and stop."
      - "If rollback is not verified, set Current State = ROLLBACK REQUIRED and stop."
      - "Set Current State = TESTING and Test Status = Running."
      - "Execute the Jungle Type pressure model."
      - "Write Pressure Notes, metrics, and Failure Modes."
      - "Set Test Status = Complete and Current State = SCORING."
    writes:
      - "Current State"
      - "Test Status"
      - "Pressure Notes"
      - "Failure Modes"
      - "Test Records"
  - id: "SJI-A03"
    name: "Scoring Agent"
    trigger: "Test Status changes to Complete"
    guards:
      - "All seven vectors present and between 1 and 5"
    steps:
      - "Calculate the seven-vector SJI."
      - "Calculate Capability Score and Evidence Confidence."
      - "Load the previous verified SJI."
      - "For a first assessment, set Previous SJI = current SJI."
      - "Compute score delta, degradation drift, improvement gain, gate, and drift state."
      - "Mirror Gate formula into Gate State select."
      - "Set Current State = EVIDENCE REVIEW."
    writes:
      - "Previous SJI"
      - "Capability Score"
      - "Evidence Confidence"
      - "Gate State"
      - "Current State"
  - id: "SJI-A04"
    name: "Drift Detection Agent"
    trigger: "SJI vectors updated and Previous SJI exists"
    guards:
      - "Previous SJI is numeric"
    steps:
      - "Read Score Delta, Degradation Drift, and Improvement Gain."
      - "Classify drift using locked thresholds."
      - "Create a Drift record in SJI Drift & Escalation Registry."
      - "If Stable, update Last Stable State to current SJI."
    writes:
      - "Drift & Escalation Records"
      - "Last Stable State"
  - id: "SJI-A05"
    name: "Routing Agent"
    trigger: "Gate formula or Gate State changes"
    guards:
      - "Gate State matches Gate formula"
    steps:
      - "Map APEX to Scale."
      - "Map STRONG to Optimize."
      - "Map FRAGILE to Stabilize."
      - "Map WEAK to Repair."
      - "Map FAILURE to Rebuild."
      - "Set Current State = ROUTED."
    writes:
      - "Lane"
      - "Current State"
  - id: "SJI-A06"
    name: "Evidence Agent"
    trigger: "Evidence Packet Submitted = true"
    guards:
      - "Evidence packet linked to a system"
    steps:
      - "Check logs, metrics, screenshots, and recovery notes when required."
      - "Assign Evidence Confidence 0-3."
      - "If incomplete, set Current State = EVIDENCE INCOMPLETE and keep packet unlocked."
      - "If complete, generate integrity hash, lock packet, and return system to EVIDENCE REVIEW or ROUTED."
    writes:
      - "Evidence Confidence"
      - "Current State"
      - "Evidence packet Locked"
      - "Integrity Hash"
  - id: "SJI-A07"
    name: "Recovery Agent"
    trigger: "SJI < 3.0 OR Degradation Drift >= 0.10"
    guards:
      - "Lane in Stabilize, Repair, Rebuild"
    steps:
      - "Select the lane-specific playbook."
      - "Generate one bounded, measurable, reversible action."
      - "Assign owner and due date."
      - "Create a Recovery Intervention record."
      - "Set Recovery Status = Active and Current State = RECOVERY ACTIVE."
    writes:
      - "Recovery Records"
      - "Owner"
      - "Owner Action"
      - "Next Action"
      - "Recovery Status"
      - "Current State"
  - id: "SJI-A08"
    name: "Escalation Agent"
    trigger: "SJI < 2.0 OR Degradation Drift >= 0.30"
    guards:
      - "Escalation State != Active"
    steps:
      - "Set Permission State = Frozen."
      - "Set Authority State = Escalated and Escalation State = Active."
      - "Create an Escalation record and evidence packet."
      - "If SJI < 1.5, set Quarantine State = Quarantined and Current State = QUARANTINED."
    writes:
      - "Permission State"
      - "Authority State"
      - "Escalation State"
      - "Quarantine State"
      - "Current State"
  - id: "SJI-A09"
    name: "Failure Protocol Agent"
    trigger: "SJI < 1.5"
    guards:
      - "Quarantine State != Rebuilding"
    steps:
      - "Set Quarantine State = Quarantined."
      - "Set Mutation Permission = Blocked and Permission State = Frozen."
      - "Set Lane = Rebuild."
      - "Set Current State = REBUILDING and Quarantine State = Rebuilding."
      - "Require verified recovery before re-entry."
    writes:
      - "Quarantine State"
      - "Mutation Permission"
      - "Permission State"
      - "Lane"
      - "Current State"
  - id: "SJI-A10"
    name: "Release Verification Agent"
    trigger: "Recovery Status = Complete AND verification requested"
    guards:
      - "Authority State = Granted"
      - "Rollback Verified = true"
    steps:
      - "Compare baseline and post-intervention SJI."
      - "Compare baseline and post-intervention Capability Score."
      - "Validate Evidence Confidence against the release policy."
      - "Issue RED when unsafe, unsupported, unauthorized, or unverified."
      - "Issue BLUE when bounded operation is supported but scale is not verified."
      - "Issue GREEN when evidence-backed capability is verified and safe to scale."
      - "Create Verification / Release record and set Current State = MONITORING."
    writes:
      - "Verification & Release Records"
      - "Release Decision"
      - "Verification Status"
      - "Current State"
