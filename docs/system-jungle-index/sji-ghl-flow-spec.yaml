version: "2.0"
system: "SJI GHL Projection Layer"
purpose: "Human communication, assignments, reminders, and escalation projections only."
source_of_truth: "Notion SJI registries / governed runtime"
prohibited:
  - "GHL must not calculate the canonical SJI."
  - "GHL must not grant authority or release GREEN independently."
  - "GHL must not mutate Frozen or Blocked records."
custom_fields:
  - "sji_record_id"
  - "system_id"
  - "jungle_type"
  - "sji_score"
  - "gate_state"
  - "lane"
  - "risk_class"
  - "current_state"
  - "recovery_status"
  - "release_decision"
  - "next_review"
workflows:
  - id: "GHL-SJI-01"
    name: "Registered system notification"
    trigger: "Current State becomes REGISTERED"
    actions:
      - "Upsert opportunity/contact by System ID."
      - "Apply tag SJI:REGISTERED."
      - "Create owner task: review identity and rollback requirements."
      - "Send internal notification with cockpit link."
  - id: "GHL-SJI-02"
    name: "Authority and rollback request"
    trigger: "Test Approval = Requested"
    actions:
      - "Create authority approval task."
      - "Create rollback verification task."
      - "Do not move to test-ready pipeline stage until both are complete."
  - id: "GHL-SJI-03"
    name: "Recovery operation"
    trigger: "Recovery Status becomes Active"
    actions:
      - "Move opportunity to SJI / Recovery Active."
      - "Assign owner and due date."
      - "Send bounded action summary."
      - "Escalate overdue Critical tasks daily."
  - id: "GHL-SJI-04"
    name: "Critical escalation"
    trigger: "Authority State = Escalated OR Permission State = Frozen"
    actions:
      - "Apply tag SJI:ESCALATED."
      - "Notify Founder and Engine Owner immediately."
      - "Create high-priority call/task."
      - "Suppress promotional and release sequences."
  - id: "GHL-SJI-05"
    name: "Quarantine protocol"
    trigger: "Quarantine State in Quarantined/Rebuilding"
    actions:
      - "Move opportunity to SJI / Quarantine."
      - "Apply tag SJI:QUARANTINED."
      - "Create rebuild checklist task bundle."
      - "Block all release-related workflows."
  - id: "GHL-SJI-06"
    name: "Verification and release projection"
    trigger: "Release Decision issued"
    actions:
      - "RED: create correction task and keep release blocked."
      - "BLUE: create monitoring task and preserve bounded limits."
      - "GREEN: move to Verified Capability and schedule next review."
      - "Always include evidence and Notion record links."
  - id: "GHL-SJI-07"
    name: "Next review reminder"
    trigger: "Next Review is approaching"
    actions:
      - "Send owner reminder 72 hours before review."
      - "Escalate at 24 hours for High/Critical systems."
      - "Create missed-review task when overdue."
