schema_version: "1.0"
system_id: PFU-FULLSTACK-AGENTIC-STACK
system_version: "1.2.0"
status: CANON_CANDIDATE
owner: Ryan Richard Levack-Carr
purpose: Govern and route every PFU subsystem through declared models, tools, agents, surfaces, memory, runtime, workflows, evidence, constitutional capability, domain contracts, federated evidence boundaries, and release authority.
constitution:
  constitution_id: PFU-CONSTITUTION
  version: "1.0.0"
  state: RATIFIED
  document: docs/pfu/constitution/pfu-constitution-v1.md
  ratification_event: evidence/pfu/pfu-constitution-ratification.event.yaml
  ratified_by: Ryan Richard Levack-Carr
  ratified_at: "2026-08-05T16:20:00Z"
  enforcement_scope: GOVERNANCE_ONLY
  release_state: BLUE
authority_chain:
  - FOUNDER
  - PFU_CONSTITUTION
  - PFU_KERNEL
  - BMOS_CONSTITUTIONAL_OS
  - AUTHORIZED_SUBSYSTEM
registry:
  human_control_plane: Notion
  executable_source_of_truth: GitHub
required_declarations:
  - models
  - tools
  - agents
  - surfaces
  - memory
  - runtime
  - permissions
  - inputs
  - outputs
  - evidence_destination
  - failure_policy
  - release_authority
runtime_loop:
  - read_governance
  - read_registry
  - select_authorized_subsystem
  - load_contracts
  - execute_bounded_workflow
  - validate_output
  - record_evidence
  - apply_release_gate
execution_doctrine:
  doctrine_id: SPLITPARLALUNIFEDEEXECUTIOM
  version: "1.0.0"
  status: CANON_CANDIDATE_BLUE
  document: docs/pfu/doctrines/splitparlalunifedeexecutiom-v1.md
  formula:
    - split_domains
    - parallel_operation
    - unified_evidence_view
    - federated_execution_instances
    - execution_first_proof
  unified_authority: false
  founder_release_gate_required: true
federated_evidence:
  policy: policies/pfu/federated-evidence-policy.yaml
  envelope_contract: contracts/pfu/federated-evidence-envelope.schema.json
  acceptance_checklist: evals/pfu/federated-execution-acceptance-checklist.md
  bridge_default: deny
  architecture_inheritance: forbidden
  shared_backend_authority: forbidden
  shared_database_trust: forbidden
  automatic_role_propagation: forbidden
  cross_domain_ssot_authority: forbidden
  auto_publish: false
  auto_approval: false
constitutional_subsystems:
  - system_id: BMOS-CONSTITUTIONAL-OS
    registration: registrations/pfu/bmos.system.yaml
    manifest: manifests/pfu/bmos.manifest.yaml
    status: REGISTERED_BLUE
registered_domains:
  - domain_id: PFU-DOMAIN-MERCH-SHIP
    profile: manifests/pfu/domains/merch-ship-runtime-profile.yaml
    status: STRUCTURAL_ONLY
kernel:
  specification: docs/pfu/kernel/pfu-os-kernel-spec-v1.md
  constitutional_authorization: ACTIVE_GOVERNANCE_ONLY
  enforcement_policy: policies/pfu/kernel-enforcement-rules.yaml
  lifecycle: flows/pfu/capability-lifecycle.yaml
  capability_contract: contracts/pfu/capability-registration.schema.yaml
  domain_contract: contracts/pfu/domain-runtime.schema.yaml
  enforcement_evidence_contract: evidence/pfu/kernel-enforcement-record.schema.yaml
  installation_evidence: evidence/pfu/bmos-kernel-installation.record.yaml
  ratification_evidence: evidence/pfu/pfu-constitution-ratification.event.yaml
  compliance_evaluation: evals/pfu/kernel-compliance-checklist.md
machine_layer:
  version: "1.0.0"
  status: GENERATED_VALIDATED
  validation_standard: JSON_SCHEMA_DRAFT_2020_12
  validation_evidence: evidence/pfu/machine-layer-schema-validation-2026-08-05.event.json
  schemas:
    capability: contracts/pfu/machine/capability.schema.json
    domain_contract: contracts/pfu/machine/domain-contract.schema.json
    lifecycle_state: contracts/pfu/machine/lifecycle-state.schema.json
    evidence_event: contracts/pfu/machine/evidence-event.schema.json
    mutation_request: contracts/pfu/machine/mutation-request.schema.json
    release_verdict: contracts/pfu/machine/release-verdict.schema.json
protected_boundaries:
  - todo-app/
release_policy: policies/pfu/release-policy.yaml
registration_contract: contracts/pfu/system-registration.schema.yaml
evidence_contract: evidence/pfu/evidence-record.schema.yaml
claim_boundaries:
  feature_branch_structure: allowed
  constitutional_ratification: recorded_on_governed_branch_and_notion
  machine_layer: generated_and_validated_on_governed_feature_branch
  federated_execution_doctrine: architecture_and_policy_only_until_validated
  cross_domain_runtime: not_authorized_by_doctrine_installation
  merge: explicit_founder_authority_required
  deployment: not_authorized
  runtime_activation: not_authorized
  production_execution: not_authorized
  domain_mutation: hold
