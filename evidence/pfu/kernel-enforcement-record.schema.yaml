$schema: https://json-schema.org/draft/2020-12/schema
$id: pfu/kernel-enforcement-record.schema.yaml
title: PFU Kernel Enforcement Record
version: "1.0.0"
type: object
additionalProperties: false
required:
  - record_id
  - request_id
  - system_id
  - domain_id
  - actor_id
  - requested_action
  - gates
  - kernel_admission_outcome
  - release_state
  - reasons
  - timestamp
properties:
  record_id:
    type: string
    pattern: "^KER-[A-Z0-9-]+$"
  request_id: {type: string, minLength: 1}
  system_id: {type: string, minLength: 1}
  domain_id: {type: string, minLength: 1}
  capability_id: {type: [string, "null"]}
  actor_id: {type: string, minLength: 1}
  requested_action: {type: string, minLength: 1}
  gates:
    type: object
    additionalProperties: false
    required: [identity, authority, registration, boundary, lifecycle, evidence, mutation, anti_drift, release]
    properties:
      identity: {$ref: "#/$defs/gate"}
      authority: {$ref: "#/$defs/gate"}
      registration: {$ref: "#/$defs/gate"}
      boundary: {$ref: "#/$defs/gate"}
      lifecycle: {$ref: "#/$defs/gate"}
      evidence: {$ref: "#/$defs/gate"}
      mutation: {$ref: "#/$defs/gate"}
      anti_drift: {$ref: "#/$defs/gate"}
      release: {$ref: "#/$defs/gate"}
  kernel_admission_outcome:
    type: string
    enum: [HOLD, CORRECTION_REQUIRED, PROVISIONAL, ADMITTED]
  release_state:
    type: string
    enum: [RED, BLUE, GREEN]
  reasons:
    type: array
    minItems: 1
    items: {type: string}
  required_corrections:
    type: array
    items: {type: string}
  evidence_references:
    type: array
    items: {type: string}
  approved_by:
    type: array
    items: {type: string}
  verified_by:
    type: array
    items: {type: string}
  commit_sha:
    type: [string, "null"]
    pattern: "^[a-f0-9]{40}$"
  timestamp:
    type: string
    format: date-time
$defs:
  gate:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        type: string
        enum: [PASS, FAIL, NOT_APPLICABLE, NOT_EVALUATED]
      control_ids:
        type: array
        items: {type: string}
      evidence:
        type: array
        items: {type: string}
      notes: {type: string}
