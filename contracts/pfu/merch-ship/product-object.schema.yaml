$schema: https://json-schema.org/draft/2020-12/schema
$id: pfu/merch-ship/product-object.schema.yaml
title: MERCH SHIP Governed Product Object
version: "1.0.0"
type: object
additionalProperties: false
required:
  - product_object_id
  - engine_id
  - lifecycle_class
  - commercial_skus
  - status
properties:
  product_object_id:
    type: string
    minLength: 3
  engine_id:
    type: string
    minLength: 3
  lifecycle_class:
    enum: [HERO, EVERGREEN, LIMITED, LIMITED_FAMILY_SET]
  commercial_skus:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: '^[A-Z0-9]+-[A-Z0-9]+-[A-Z0-9]+-V[0-9]+-Q4$'
  status:
    enum: [CANDIDATE, PACKAGE_READY, OFFER_DEFINED, ACTIVE, HOLD, RETIRED]
  provider_mappings:
    type: array
    items:
      type: object
      required: [provider, status]
      properties:
        provider: {enum: [PRINTIFY, GELATO, OTHER_APPROVED]}
        external_product_id: {type: [string, 'null']}
        variant_map_reference: {type: [string, 'null']}
        status: {enum: [NOT_MAPPED, MAPPED_UNVERIFIED, VERIFIED, HOLD]}
      additionalProperties: false
  cost:
    type: [number, 'null']
    minimum: 0
  retail:
    type: [number, 'null']
    minimum: 0
  mockup_link:
    type: [string, 'null']
  release_verdict:
    enum: [NOT_EVALUATED, HOLD, APPROVED]
