domain_id: PFU-DOMAIN-MERCH-SHIP
domain_version: "1.0.0"
canonical_name: MERCH SHIP
owner: Ryan Richard Levack-Carr
purpose: Operate the MERCH SHIP commerce and creator-technology domain under PFU governance and BMOS constitutional controls.
parent_system: PFU-FULLSTACK-AGENTIC-STACK
constitutional_system: BMOS-CONSTITUTIONAL-OS
status: REGISTERED_BLUE
kernel_admission_outcome: PROVISIONAL
release_state: BLUE
runtime_boundary:
  environments: [repository_structural]
  execution_authority: explicit_founder_authorization
  activation_state: STRUCTURAL_ONLY
data_boundary:
  owned_data:
    - MERCH_SHIP_domain_state
    - MERCH_SHIP_governance_records
    - authorized_v2_application_state
  prohibited_access:
    - other_domain_protected_state_without_contract
    - credentials_or_secrets_in_repository
  cross_domain_contract_required: true
authorized_actors:
  - actor_id: FOUNDER-RYAN-RICHARD-LEVACK-CARR
    role: constitutional_and_release_authority
    permissions: [approve_structure, authorize_merge, authorize_runtime_activation, authorize_release]
  - actor_id: PFU-AUTHORIZED-IMPLEMENTOR
    role: bounded_implementation
    permissions: [create_branch_changes, test, prepare_evidence]
  - actor_id: PFU-AUTHORIZED-EVIDENCE-ANALYST
    role: independent_verification
    permissions: [inspect, validate, issue_hold, issue_correction_required]
bmos_services: [CABMM, LUGH, OORCK, LoR, ROCK, ATLAS, HI]
field_operations:
  - Architect
  - Experience Studio
  - Implementor
  - Operations Coordinator
  - Evidence Analyst
  - Librarian
  - Brock HQ
lifecycle_mapping:
  workflow: flows/pfu/capability-lifecycle.yaml
  transition_evidence_required: true
evidence_destination:
  notion: PFU Systems Registry and BMOS installation pages
  github: evidence/pfu and pull-request history
  runtime: not_activated
failure_policy:
  timeout: required_before_runtime_activation
  retry: bounded_and_idempotent_for_mutations
  escalation: Founder or explicitly delegated authority
  rollback: required_when_reversible
release_authority:
  founder_required: true
  policy: policies/pfu/release-policy.yaml
protected_paths:
  - todo-app/
implementation_scope:
  allowed:
    - docs/pfu/
    - manifests/pfu/
    - contracts/pfu/
    - policies/pfu/
    - flows/pfu/
    - evidence/pfu/
    - evals/pfu/
  excluded:
    - application_runtime_mutation
    - infrastructure_mutation
    - secret_change
    - deployment
    - public_release
claim_boundaries:
  kernel_governed_structure: installed_on_feature_branch
  merged_to_main: false
  runtime_active: false
  production_ready: false
  deployed: false
