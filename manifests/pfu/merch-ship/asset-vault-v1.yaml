ingestion_policy:
  discovery_sources:
    - ChatGPT_Library
    - Google_Drive
    - GitHub
    - Notion
  default_destination: 00_INBOX_REVIEW
  promote_only_when:
    - canonical_identity_matches_current_ssot
    - duplicate_and_version_check_complete
    - authority_and_release_state_known
    - provider_or_platform_claims_verified_when_applicable
  stale_or_conflicting_artifact_action: retain_in_inbox_or_archive_and_never_silently_promote
  destructive_move_or_delete: false
  preserve_originals: true
current_ingested_candidates:
  - file: CANDIDATE_LEGACY__MERCH_SHIP_Q4_12_SKU_Airtable.csv
    state: INBOX_REVIEW_CONFLICTING_SKU_IDENTITIES
