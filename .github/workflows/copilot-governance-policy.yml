name: Copilot governance policy

on:
  pull_request:
    paths:
      - "governance/copilot/**"
      - ".github/workflows/copilot-governance-policy.yml"
  push:
    branches:
      - main
    paths:
      - "governance/copilot/**"
      - ".github/workflows/copilot-governance-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate corrected governance structure and activation posture
        run: python governance/copilot/validate_policy.py --mode structural
      - name: Test native and PFU resolution boundaries
        run: python -m unittest discover governance/copilot/tests -v
      - name: Scan high-risk credential patterns and structured files
        run: python governance/copilot/scan_secrets.py
